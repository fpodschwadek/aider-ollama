services:

  aider:
    container_name: ao-aider
    depends_on:
      llm:
        condition: service_healthy
    entrypoint: /bin/sh
    environment:
      AIDER_EDIT_FORMAT: ${EDIT_FORMAT:-whole}
      AIDER_GIT: ${GIT:-false}
      AIDER_MODEL: ollama/${MODEL:?Set MODEL in .env}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
      OLLAMA_API_BASE: http://llm:11434
    extra_hosts:
      - host.docker.internal:host-gateway
    image: paulgauthier/aider-full
    networks:
      - default
    tty: true
    user: 1000:1000
    volumes:
      - ${PROJECT_PATH:-./project}:/app

  llm:
    container_name: ao-llm
    environment:
      OLLAMA_CONTEXT_LENGTH: ${CONTEXT_LENGTH:-8192}
    expose:
      - 11434
    healthcheck:
      interval: 5s
      retries: 12
      test: ["CMD", "ollama", "list"]
    image: ollama/ollama
    networks:
      - default
    volumes:
      - ./llm:/root/.ollama

networks:
  default:
